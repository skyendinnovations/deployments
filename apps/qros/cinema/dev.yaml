apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: qros-cinema-dev
  labels:
    app: qros
    service: cinema
    env: dev
    public: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: run-qros@skyend-apps-2026.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: asia-southeast1-docker.pkg.dev/skyend-apps-2026/qros/cinema:v0.3.0
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: BETTER_AUTH_URL
              value: https://cinema.qros.dev.pramothsgp.me
            - name: ADMIN_EMAILS
              value: "pramothsgp@gmail.com,skyendinnovations@gmail.com"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qros-dev-database-url
                  key: latest
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: qros-dev-auth-secret
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-client-id
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-client-secret
                  key: latest
            - name: STORAGE_PROVIDER
              value: r2
            - name: STORAGE_BUCKET
              value: qros-dev
            - name: R2_ACCOUNT_ID
              value: d3582708044db4fef6455d53f1548c04
            - name: STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: qros-dev-storage-access-key-id
            - name: STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: qros-dev-storage-secret-access-key
            - name: INTERNAL_QROS_API_URL
              value: https://qros-api-dev-648228298107.asia-southeast1.run.app
