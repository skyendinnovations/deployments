apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: qros-api-dev
  labels:
    app: qros
    service: api
    env: dev
    public: "false"
    platform-access: "3737a4bb2709"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: run-qros@skyend-apps-2026.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-docker.pkg.dev/cloudrun/container/hello
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: BETTER_AUTH_URL
              value: https://api.qros.dev.pramothsgp.me
            - name: ADMIN_EMAILS
              value: "pramothsgp@gmail.com,skyendinnovations@gmail.com"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qros-dev-database-url
                  key: latest
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: qros-dev-auth-secret
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-client-id
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-client-secret
                  key: latest
            - name: INTERNAL_APP
              value: qros
platform:
  url: https://qros-api-dev-648228298107.asia-southeast1.run.app
