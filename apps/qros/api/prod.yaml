apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: qros-api-prod
  labels:
    app: qros
    service: api
    env: prod
    public: "false"
    platform-access: "3737a4bb2709"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: run-qros@skyend-apps-2026.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-docker.pkg.dev/cloudrun/container/hello
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: BETTER_AUTH_URL
              value: https://api.qros.pramothsgp.me
            - name: ADMIN_EMAILS
              value: "pramothsgp@gmail.com,skyendinnovations@gmail.com"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qros-prod-database-url
                  key: latest
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: qros-prod-auth-secret
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-client-id
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-client-secret
                  key: latest
            - name: STORAGE_PROVIDER
              value: r2
            - name: STORAGE_BUCKET
              value: qros-prod
            - name: R2_ACCOUNT_ID
              value: d3582708044db4fef6455d53f1548c04
            - name: STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: qros-prod-storage-access-key-id
            - name: STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: qros-prod-storage-secret-access-key
            - name: INTERNAL_APP
              value: qros
platform:
  url: https://qros-api-prod-648228298107.asia-southeast1.run.app
