apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kittest-web-prod
  labels:
    app: kittest
    service: web
    env: prod
    public: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: run-kittest@skyend-apps-2026.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-docker.pkg.dev/cloudrun/container/hello
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: BETTER_AUTH_URL
              value: https://kittest-web-prod-648228298107.asia-southeast1.run.app
            - name: ADMIN_EMAILS
              value: "pramothsgp@gmail.com,skyendinnovations@gmail.com"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kittest-prod-database-url
                  key: latest
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kittest-prod-auth-secret
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-client-id
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-client-secret
                  key: latest
