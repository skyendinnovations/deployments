name: deploy

# Pushes deploy dev files only. Prod deploys only from a manual run: the promote workflow (which starts
# this one with the prod files) or this workflow run by hand. Prod runs still wait for approval.
on:
  push:
    branches: [main]
    paths: ["apps/**.yaml"]
  workflow_dispatch:
    inputs:
      files:
        description: "Space-separated service files, e.g. apps/menu/web/prod.yaml (usually started by promote)"
        required: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: list
        env:
          INPUT: ${{ inputs.files }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT" ]; then
            files="$INPUT"
          elif [ -z "${BEFORE//0/}" ]; then
            files=$(git ls-files 'apps/*/*/*.yaml')
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'apps/*/*/*.yaml')
          fi
          if [ -z "$INPUT" ]; then
            skipped=$(tr ' ' '\n' <<< "$files" | grep '/prod\.yaml$' || true)
            [ -n "$skipped" ] && { echo "### Not deployed (prod deploys only via promote)"; sed 's/^/- /' <<< "$skipped"; } >> "$GITHUB_STEP_SUMMARY"
            files=$(tr ' ' '\n' <<< "$files" | grep -v '/prod\.yaml$' || true)
          fi
          for f in $files; do
            [[ "$f" =~ ^apps/[a-z0-9-]+/[a-z0-9-]+/(dev|prod)\.yaml$ && -f "$f" ]] || { echo "::error::Bad path: $f"; exit 1; }
          done
          echo "targets=$(echo "$files" | tr ' ' '\n' | jq -Rsc 'split("\n") | map(select(length > 0) | {file: ., env: (split("/")[3] | rtrimstr(".yaml"))})')" >> "$GITHUB_OUTPUT"

  apply:
    needs: changes
    if: needs.changes.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.targets) }}
    # prod has required reviewers (set by Terraform), so every prod change waits for approval.
    environment: ${{ matrix.env }}
    concurrency:
      group: ${{ matrix.file }}
    permissions:
      contents: read
      id-token: write
    env:
      FILE: ${{ matrix.file }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta # domain mappings
      # Off when the platform (apps.yaml deploy) or this file (label deploy: "false") says so. Off wins.
      - name: Up or down
        id: state
        run: |
          {
            echo "down=$(yq '.metadata.labels.deploy == "false" or .metadata.labels["platform-deploy"] == "false"' "$FILE")"
            echo "name=$(yq '.metadata.name' "$FILE")"
            echo "host=$(yq '.spec.template.spec.containers[0].env[] | select(.name == "BETTER_AUTH_URL") | .value' "$FILE" | sed -E 's#^https://##; s#/.*$##')"
          } >> "$GITHUB_OUTPUT"
      - name: Bring down
        if: steps.state.outputs.down == 'true'
        env:
          NAME: ${{ steps.state.outputs.name }}
          HOST: ${{ steps.state.outputs.host }}
        run: |
          case "$HOST" in ""|*.run.app) ;; *)
            if gcloud beta run domain-mappings describe --domain "$HOST" --region "$REGION" > /dev/null 2>&1; then
              gcloud beta run domain-mappings delete --domain "$HOST" --region "$REGION" --quiet
            fi ;;
          esac
          if gcloud run services describe "$NAME" --region "$REGION" > /dev/null 2>&1; then
            gcloud run services delete "$NAME" --region "$REGION" --quiet
            echo "$NAME: brought down (file kept; set deploy back to true to redeploy)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$NAME: down" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply
        if: steps.state.outputs.down != 'true'
        env:
          NAME: ${{ steps.state.outputs.name }}
          INVOKERS: ${{ secrets.SERVICE_INVOKERS }}
        run: |
          # platform: is ours (who may call it), not Cloud Run's.
          yq 'del(.platform)' "$FILE" > "$RUNNER_TEMP/service.yaml"
          gcloud run services replace "$RUNNER_TEMP/service.yaml" --region "$REGION" --quiet
          # Who may call it, set every deploy (removed callers lose access): everyone when public,
          # else the list the platform keeps in SERVICE_INVOKERS (a secret: it holds testers' emails).
          if [ "$(yq '.metadata.labels.public' "$FILE")" = "true" ]; then
            members='["allUsers"]'
          else
            key="${FILE#apps/}" && key="${key%.yaml}"
            members=$(jq -c --arg k "$key" '.[$k] // []' <<< "${INVOKERS:-null}")
          fi
          jq -n --argjson m "$members" \
            '{bindings: (if ($m | length) > 0 then [{role: "roles/run.invoker", members: $m}] else [] end)}' \
            > "$RUNNER_TEMP/policy.json"
          gcloud run services set-iam-policy "$NAME" "$RUNNER_TEMP/policy.json" --region "$REGION" --quiet > /dev/null
          # Count only: the log is public.
          echo "$NAME: $(jq -r 'if .bindings == [] then "nobody can call it" elif .bindings[0].members == ["allUsers"] then "public" else "internal, \(.bindings[0].members | length) allowed callers" end' "$RUNNER_TEMP/policy.json")" >> "$GITHUB_STEP_SUMMARY"
          url=$(gcloud run services describe "$NAME" --region "$REGION" --format='value(status.url)')
          echo "$NAME: $url" >> "$GITHUB_STEP_SUMMARY"
      # The public URL is BETTER_AUTH_URL (auth needs it to match). A custom host gets a domain mapping
      # once; needs the deployer as a Search Console owner of the domain and a CNAME to ghs.googlehosted.com.
      - name: Domain mapping
        if: steps.state.outputs.down != 'true'
        env:
          NAME: ${{ steps.state.outputs.name }}
          HOST: ${{ steps.state.outputs.host }}
        run: |
          case "$HOST" in ""|*.run.app) exit 0 ;; esac
          # Internal services get no domain; remove one left from when the service was public.
          if [ "$(yq '.metadata.labels.public' "$FILE")" != "true" ]; then
            if gcloud beta run domain-mappings describe --domain "$HOST" --region "$REGION" > /dev/null 2>&1; then
              gcloud beta run domain-mappings delete --domain "$HOST" --region "$REGION" --quiet
              echo "$HOST: mapping removed (service is internal)" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if gcloud beta run domain-mappings describe --domain "$HOST" --region "$REGION" > /dev/null 2>&1; then
            echo "$HOST: mapped" >> "$GITHUB_STEP_SUMMARY"
          else
            gcloud beta run domain-mappings create --service "$NAME" --domain "$HOST" --region "$REGION" --quiet
            echo "$HOST: mapping created (certificate can take up to a few hours)" >> "$GITHUB_STEP_SUMMARY"
          fi
