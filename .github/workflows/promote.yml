# Generated by platform/terraform/workflows.tf from apps.yaml. Edit it there, not here.
# The only way prod deploys: copies the dev version to prod, then deploys the chosen prod files
# (also when the version is unchanged, so prod-only edits like the deploy switch go out too).
name: promote

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy to prod (with dev's version)"
        type: choice
        required: true
        options: ["kittest"]
      service:
        description: "Service (all = every service of the app)"
        type: choice
        required: true
        default: all
        options: ["all","admin","api","web"]

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      APP: ${{ inputs.app }}
      SERVICE: ${{ inputs.service }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          [ "$SERVICE" = all ] && SERVICE=""
          [[ -d "apps/$APP" ]] || { echo "::error::$APP has no service files yet"; exit 1; }
          [[ -z "$SERVICE" || -d "apps/$APP/$SERVICE" ]] || { echo "::error::$APP has no service $SERVICE"; exit 1; }
          files="" changed="" versions=""
          for dev in apps/"$APP"/${SERVICE:-*}/dev.yaml; do
            prod="${dev%dev.yaml}prod.yaml"
            [ -f "$prod" ] || continue
            files="$files $prod"
            image=$(yq '.spec.template.spec.containers[0].image' "$dev")
            [[ "$image" == *:v* ]] || { echo "::warning::$dev has no released version yet ($image), skipped"; continue; }
            IMAGE="$image" yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' "$prod"
            git diff --quiet -- "$prod" || { changed="$changed $prod"; versions="$versions ${image##*:}"; }
          done
          [ -n "$files" ] || { echo "::error::No prod files for $APP${SERVICE:+/$SERVICE}"; exit 1; }
          if [ -n "$changed" ]; then
            version=$(tr ' ' '\n' <<< "$versions" | sort -u | xargs)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Promote $APP${SERVICE:+/$SERVICE} $version to prod"
            git push --quiet
            echo "Promoted $APP${SERVICE:+/$SERVICE} to $version." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Prod already has dev's version; redeploying the prod files as they are." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Approve the prod deploy run in the deploy workflow." >> "$GITHUB_STEP_SUMMARY"
          gh workflow run deploy.yml -f files="${files# }"
