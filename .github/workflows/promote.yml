# Generated by platform/terraform/workflows.tf from apps.yaml. Edit it there, not here.
name: promote

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to promote from dev to prod"
        type: choice
        required: true
        options: ["kittest"]
      service:
        description: "Service (all = every service of the app)"
        type: choice
        required: true
        default: all
        options: ["all","admin","web"]

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      APP: ${{ inputs.app }}
      SERVICE: ${{ inputs.service }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          [ "$SERVICE" = all ] && SERVICE=""
          [[ -d "apps/$APP" ]] || { echo "::error::$APP has no service files yet"; exit 1; }
          [[ -z "$SERVICE" || -d "apps/$APP/$SERVICE" ]] || { echo "::error::$APP has no service $SERVICE"; exit 1; }
          changed="" versions=""
          for dev in apps/"$APP"/${SERVICE:-*}/dev.yaml; do
            prod="${dev%dev.yaml}prod.yaml"
            [ -f "$prod" ] || continue
            image=$(yq '.spec.template.spec.containers[0].image' "$dev")
            [[ "$image" == *:v* ]] || { echo "::warning::$dev has no released version yet ($image), skipped"; continue; }
            IMAGE="$image" yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' "$prod"
            git diff --quiet -- "$prod" || { changed="$changed $prod"; versions="$versions ${image##*:}"; }
          done
          if [ -z "$changed" ]; then echo "prod already matches dev"; exit 0; fi
          version=$(tr ' ' '\n' <<< "$versions" | sort -u | xargs)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Promote $APP${SERVICE:+/$SERVICE} $version to prod"
          git push --quiet
          echo "Promoting $APP${SERVICE:+/$SERVICE} $version: approve the prod deploy run." >> "$GITHUB_STEP_SUMMARY"
          # Pushes made with GITHUB_TOKEN don't trigger workflows, so start the deploy explicitly.
          gh workflow run deploy.yml -f files="${changed# }"
